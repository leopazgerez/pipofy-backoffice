<nav class="cat-filter" aria-label="Secciones de configuración">
  @for (tab of tabs; track tab.path) {
    <a
      class="fchip"
      data-test="tab"
      [routerLink]="tab.path"
      routerLinkActive="on"
      #rla="routerLinkActive"
      [attr.aria-current]="rla.isActive ? 'page' : null"
    >{{ tab.label }}</a>
  }
</nav>

<router-outlet />
