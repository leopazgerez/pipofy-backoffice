# Blueprint del backoffice (sitio estático). El de la API vive en pipofy-backend/render.yaml.
#
# `npm run build` corre `node set-env.mjs production && ng build`: set-env NO encuentra
# .env.production acá (está gitignoreado) y cae al fallback que lee las NG_* de este bloque.
services:
  - type: web
    name: pipofy-backoffice
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    # Angular 20 emite el bundle del navegador en browser/, no en la raíz de dist/.
    staticPublishPath: dist/pipofy/browser
    envVars:
      - key: NG_API_BASE_URL
        value: https://pipofy-api.onrender.com/api
      # La API no expone /stream todavía: SseRealtimeConnection no tiene consumidor. Se
      # completa igual porque set-env exige las cuatro claves.
      - key: NG_REALTIME_BASE_URL
        value: https://pipofy-api.onrender.com/api/stream
      - key: NG_STORAGE_BASE_PATH
        value: /uploads
      # Placeholder: hoy no lo lee nadie (el módulo de pagos no existe). Reemplazar por la
      # public key real cuando llegue ese slice — es pública, va en el bundle por diseño.
      - key: NG_MERCADOPAGO_PUBLIC_KEY
        value: APP_USR-xxxxxxxx
      # 20.18 (el de la API) NO sirve: Angular 20 pide ^20.19 || ^22.12 || >=24.
      - key: NODE_VERSION
        value: 22.12.0
    # SPA: sin esto, entrar directo a /dashboard o abrir el link de reset del mail
    # (/reset-password?token=…) devuelve 404 en vez de cargar la app.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
